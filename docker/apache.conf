ServerName localhost

<VirtualHost *:${PORT}>
    DocumentRoot /app/web

    Alias /healthz /var/www/healthz
    <Location /healthz>
        ForceType text/plain
    </Location>

    <Directory /app/web>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
